extra_css = ["assets/stylesheets/extra.css"]

[project.theme]
variant = "classic"
language = "en"
code_wrap = true
favicon = "assets/logo/favicon.ico"
logo = "assets/logo/ombi-logo.png"
features = [
  "content.code.copy",
  "content.tabs.link",
  "header.autohide",
  "navigation.expand",
  "navigation.indexes",
  "navigation.instant",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[project.extra.analytics]
provider = "google"
property = "G-M4NQYEKN41"

[project.extra.consent]
title = "Cookie consent"
actions = ["accept", "manage", "reject"]
description = """
We use cookies to recognize your repeated visits and preferences, as well as to store your site preferences.
With your consent, you're helping us to make our documentation better (and to work better for you).
"""

[[project.extra.social]]
icon = "fontawesome/brands/discord"
